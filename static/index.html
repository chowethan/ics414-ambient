<!DOCTYPE HTML>
<html>
	<head>
		<title>App</title>
		<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Mono" rel="stylesheet" defer>
		<link href="/style/style.css" rel="stylesheet" defer>
		<script src='https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.2.0/socket.io.js' integrity='sha256-yr4fRk/GU1ehYJPAs8P4JlTgu0Hdsp4ZKrx8bDEDC3I=' crossorigin='anonymous'></script>
		<script>
			document.addEventListener('DOMContentLoaded', () => {
				const socket = io();
				
				socket.on('devices', (devices) => {
					let deviceList = document.getElementById('devices');
					
					for (let device of devices) {
						let item = document.createElement('div');
						item.className = 'item';
						let label1 = document.createElement('div');
						label1.innerText = device.model;
						let label2 = document.createElement('div');
						label2.innerText = device.id;
						
						item.appendChild(label1);
						item.appendChild(label2);
						deviceList.appendChild(item);
					}
				});
				
				function get(url) {
					return new Promise((resolve, reject) => {
						let request = new XMLHttpRequest();

						request.addEventListener('load', (event) => {
							resolve(request.responseText, request);
						});
						request.addEventListener('error', (event) => {
							reject(event, request);
						});
						request.addEventListener('abort', (event) => {
							reject(event, request);
						});

						request.open('GET', url, true);
						request.setRequestHeader('Cache-Control', 'no-cache');
						request.setRequestHeader('X-requested-With', 'XMLHttpRequest');
						request.send(null);
					});
				}
				
				let toggle = document.getElementById('toggle');
				let warm = document.getElementById('warm');
				let cold = document.getElementById('cold');
				
				// Socket control
				toggle.addEventListener('click', () => {
					socket.emit('toggle');
				});
				warm.addEventListener('click', () => {
					socket.emit('temperature', 1700);
				});
				cold.addEventListener('click', () => {
					socket.emit('temperature', 6500);
				});
			});
		</script>
	</head>
	<body style='display: flex; flex-direction: column;'>
		<div class="header">
			<div class="back">
				<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><style>.cls-1{fill:var(--theme-color);}</style></defs><polygon class="cls-1" points="82.85 43.93 23.22 43.93 53.03 14.11 44.46 5.54 0 49.99 44.45 94.46 44.46 94.46 53.03 85.88 23.22 56.06 82.85 56.06 100 56.06 100 43.93 82.85 43.93"/></svg>
			</div>
			<h1>Home</h1>
		</div>
		<div class="content">
			<div>
				<h1>Connected Devices</h1>
				<div id='devices'></div>
			</div>
			<div>
				<h1>Device Control</h1>
				<div>
					<label>On/Off</label>
					<div>
						<button id='toggle'>Toggle</button>
					</div>
				</div>
				<div>
					<label>Temperature</label>
					<div>
						<button id='warm'>Warm</button>
						<button id='cold'>Cold</button>
					</div>
				</div>
			</div>
		</div>
		<div class="menu">
			<div class="active"><div class="label">Home</div></div>
			<div><span class="label">Events</span></div>
			<div><span class="label">Devices</span></div>
		</div>
	</body>
</html>
