<!DOCTYPE html>
<html>
	<head>
		<meta charset='UTF-8'>
		<title>Egg Timer</title>
		<meta name='viewport' content='width=device-width, initial-scale=1, shrink-to-fit=yes'>
		<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>

		<link href='https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Mono' rel='stylesheet' defer>
		<link rel='stylesheet' href='https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css' integrity='sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm' crossorigin='anonymous' defer>
		<link rel='stylesheet' href='style/eggTimer.css' defer>
		<link href='/style/style.css' rel='stylesheet' defer>
	</head>
	<body>
		<div class='header'>
			<h1>Egg Timer</h1>
		</div>
		<div class='content'>
			<div class='custom-container container rounded'>
				<h3 class='text-center my-3'>Cook Your Perfect Egg</h3>
				<img src='https://kirbiecravings.com/wp-content/uploads/2017/01/instant-pot-soft-hard-boiled-eggs-4ab.jpg' class='rounded-circle' alt='Hard boiled eggs' style='width: 300px; margin-bottom: 20px;'>
				<br>
				<br>
				<button onClick='getLocation()'>Get Current Altitude</button>
				<br><br>
				<div class='card bg-primary text-white  h-10'>
					<div id='loc' class='card-body'>Not Found</div>
				</div>

				<br>
				<div class='eggTimerInputs container rounded'>
					<span><h2>Default Options</h2></span>
					<div class='row'>
						<div class='col'>
							<div class='input-group mb-2'>
								<div class='input-group-prepend'>
									<span class='input-group-text'>Egg Type</span>
								</div>
								<select class='form-control' id='eggType'>
									<option value=1>Hard Boiled</option>
									<option value=2>Medium Boiled</option>
									<option value=3>Soft Boiled</option>
								</select>
							</div>
						</div>
					</div>
					<div class='row'>
						<div class='col'>
							<div class='input-group mb-3'>
								<div class='input-group-prepend'>
									<span class='input-group-text'>Egg Size</span>
								</div>
								<select class='form-control' id='eggSize'>
									<option value=1>Large</option>
									<option value=2>Medium</option>
								</select>
							</div>
						</div>
					</div>

					<div class='row'>
						<div class='col'>
							<div class='input-group mb-2'>
								<div class='input-group-prepend'>
									<span class='input-group-text'>Approximate Egg temperature before boiling</span>
								</div>
								<select class='form-control' id='approx_egg_temp'>
									<option value=1>From Refrigerator</option>
									<option value=2>Room Temperature</option>
								</select>
							</div>
						</div>
					</div>
				</div>
				<br>
				<div class='eggTimerInputs container rounded'>
					<span><h2>Advanced Options</h2></span>
					<div class='row'>
						<div class='col'>
							<div class='input-group mb-2'>
								<div class='input-group-prepend'>
									<span class='input-group-text'>Egg Type</span>
								</div>
								<input type='number' id='target_egg_temp' placeholder='degrees celcius (The exact temperature you desire your finished egg to be at)' class='form-control'>
							</div>
						</div>
					</div>
                    <div class='row'>
						<div class='col'>
							<div class='input-group mb-3'>
								<div class='input-group-prepend'>
									<span class='input-group-text'>Egg Size</span>
								</div>
								<select class='form-control' id='eggSize'>
									<option value=1>Large</option>
									<option value=2>Medium</option>
								</select>
							</div>
						</div>
					</div>
					<div class='row'>
						<div class='col'>
							<div class='input-group mb-2'>
								<div class='input-group-prepend'>
									<span class='input-group-text'>Exact Egg temperature before boiling</span>
								</div>
								<input type='number' id='exact_egg_temp' placeholder='degrees celcius (ie, if it was taken from the refrigerator, the temperature of the refrigerator)' class='form-control'>
							</div>
						</div>
					</div>
					<div class='row'>
						<div class='col'>
							<div class='input-group mb-2'>
								<div class='input-group-prepend'>
									<span class='input-group-text'>Exact Temperature of Water</span>
								</div>
								<input type='number' id='pressure_exact' placeholder='degree celcius' class='form-control'>
							</div>
						</div>
					</div>
				</div>
				<br>
				<button type='button' onClick='startTimer()'>Start Timer</button>
				<button type='button' onClick='clearTimer()'>Reset Timer</button>

				<br><br>

				<div class='card' style='margin-bottom: 50px;'>
					<h2 class='card-header text-center'>Time</h2>
					<div id='clockdiv'>
						<div>
							<span class='minutes'></span>
							<div class='smalltext'>Minutes</div>
						</div>
						<div>
							<span class='seconds'></span>
							<div class='smalltext'>Seconds</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class='footer'>
			<div class='menu'>
				<a href='/'><div class='label'>Home</div></a>
				<a class='active'><span class='label'><span class='label'>Egg Timer</span></span></a>
			</div>
		</div>
		<script src='script/eggTimer.js'></script>
		<script src='script/stopWatch.js'></script>

	</body>
</html>
