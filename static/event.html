<!DOCTYPE HTML>
<html>
	<head>
		<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>
		<title>App</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
		<link href='https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Mono' rel='stylesheet' defer>
		<link href='/style/style.css' rel='stylesheet' defer>
		<script src='https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.2.0/socket.io.js' integrity='sha256-yr4fRk/GU1ehYJPAs8P4JlTgu0Hdsp4ZKrx8bDEDC3I=' crossorigin='anonymous'></script>

		<script type="module">
			import ListItem from '/script/component/ListItem.js';
			
			document.addEventListener('DOMContentLoaded', () => {
				const socket = io();
                
                socket.on('alert_scheduled', (cron_string) => {
                    console.log(cron_string);
                    addEventItem(cron_string);        
                });
            
                function addEventItem(cron_string){
                    let numberPattern = /\d+/g;   
                    let alert_time = cron_string.match(numberPattern);
                    console.log(alert_time);
                    
                    //array holds alert by minute, hour, day
                    let event_string = dayOf(alert_time[2]) + ", ";
                    event_string += alert_time[1] + ":" + alert_time[0];
                    
                    let events = document.getElementById('events');
                    var item = document.createElement('li');
                    item.innerHTML = event_string;
                    item.setAttribute('class', 'list-group-item');
                    events.appendChild(item);
                }
    
                socket.on('displayAlerts', (yeelightEvents) => {
                    console.log(yeelightEvents.length);
                    for(let alert of yeelightEvents){
                        console.log(alert);
                        addEventItem(alert);
                    }
                });
				
                let day = document.getElementById("day");
                let hour = document.getElementById("hour");
                let minute = document.getElementById("minute");
                
				let set_alert = document.getElementById("set_alert");
            
                set_alert.addEventListener('click', () => {
                    if(checkAlert(day.value, hour.value, minute.value)){
                       console.log("alert set");
					   socket.emit('set_event', {day: day.value, 
                                                 hour: hour.value, 
                                                 minute: minute.value});
                    }else{
                        console.log("incorrect alert values");
                    }
				});
         //end of cron job stuff
                

			});
            
            function checkAlert(day, hour, minute){
                    if(day == undefined){
                        return false;   
                    }
                    if(hour<0 || hour>23){                    
                        return false;
                    }
                    if(minute < 0 || minute > 59){
                        return false;
                    }
                    return true;
            }
            
            function dayOf(int_day){
                let day="";
                switch (parseInt(int_day)) {
                  case 0:
                    day = "Sunday";
                    break;
                  case 1:
                    day = "Monday";
                    break;
                  case 2:
                     day = "Tuesday";
                    break;
                  case 3:
                    day = "Wednesday";
                    break;
                  case 4:
                    day = "Thursday";
                    break;
                  case 5:
                    day = "Friday";
                    break;
                  case 6:
                    day = "Saturday";
                }
                return day;
            }
            
		</script>
	</head>
	<body style='display: flex; flex-direction: column; background-color:#3d3d35'>
		<div class='header'>
			<h1><a href="index.html">Home</a></h1>
		</div>
		<div class='custom-container container rounded'>
            <div class="row">
			<div class="col">
                <div class='left-home-input container'>
                    <h1>Events</h1>
                    <hr>

                    <ul class="list-group" id='events'></ul>
    <!--				<div id='devices'><ambient-item text='Device' detail='Yeelight White Tunable'></ambient-item></div>-->
                </div>
			</div>
            <div class="headerDivider"></div>
            <div class="col">
                <div class='left-home-input container'>
                    <h1>Add Event</h1>
                    <hr>
                    <div>
                        <label>Day of week</label>
                        <div>
                            <select id="day">
                              <option value=1>monday</option>
                              <option value=2>tuesday</option>
                              <option value=3>wednesday</option>
                              <option value=4>thursday</option>
                              <option value=5>friday</option>
                              <option value=6>saturday</option>
                              <option value=0>sunday</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label>Hour</label>
                        <div>
                            <input type="number" id="hour" placeholder="hour 0-23">
                        </div>
                    </div>
                    <div>
                        <label>Minute</label>
                        <div>
                            <input type="number" id="minute" placeholder="minute 0-59">
                        </div>
                    </div> 
                    <div>
                        <label>Set Alert</label>
                        <div>
                            <button class="btn btn-primary" id="set_alert">Set Alert</button>
                        </div>
                    </div>                   
			     </div>
            </div>
            <br><br>
		  </div>
        </div>
        <div class="footer container rounded">
            <div class='menu' style="margin-bottom: 20px;">
                <div><span class='label'><a href="index.html"><span class='label'>Home</span></a></span></div>
                <div class='active'><div class='label'>Events</div></div>
                <div><span class='label'><a href="egg_timer.html"><span class='label'>Egg Timer</span></a></span></div>
            </div>
        </div>
        
	</body>
</html>
