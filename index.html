<!DOCTYPE HTML>
<html>
	<head>
		<title>App</title>
		<style>
			body {
				margin: 0;
				padding: 0;
				width: 100vw;
				height: 100vh;
			}
			
			body > div {
				border-right: 1px solid #CCC;
			}
			
			label {
				display: block;
			}
			
			.item {
				padding: 10px 0;
			}
		</style>
		<script src='https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.2.0/socket.io.js' integrity='sha256-yr4fRk/GU1ehYJPAs8P4JlTgu0Hdsp4ZKrx8bDEDC3I=' crossorigin='anonymous'></script>
		<script>
			document.addEventListener('DOMContentLoaded', () => {
				const socket = io();
				
				socket.on('devices', (devices) => {
					let deviceList = document.getElementById('devices');
					
					for (let device of devices) {
						let item = document.createElement('div');
						item.className = 'item';
						let label1 = document.createElement('div');
						label1.innerText = device.model;
						let label2 = document.createElement('div');
						label2.innerText = device.id;
						
						item.appendChild(label1);
						item.appendChild(label2);
						deviceList.appendChild(item);
					}
				});
				
				function get(url) {
					return new Promise((resolve, reject) => {
						let request = new XMLHttpRequest();

						request.addEventListener('load', (event) => {
							resolve(request.responseText, request);
						});
						request.addEventListener('error', (event) => {
							reject(event, request);
						});
						request.addEventListener('abort', (event) => {
							reject(event, request);
						});

						request.open('GET', url, true);
						request.setRequestHeader('Cache-Control', 'no-cache');
						request.setRequestHeader('X-requested-With', 'XMLHttpRequest');
						request.send(null);
					});
				}
				
				let toggle1 = document.getElementById('toggle1');
				let warm1 = document.getElementById('warm1');
				let cold1 = document.getElementById('cold1');
				let toggle2 = document.getElementById('toggle2');
				let warm2 = document.getElementById('warm2');
				let cold2 = document.getElementById('cold2');
				
				// Old HTTP endpoint API
				toggle1.addEventListener('click', () => {
					get('/api/toggle');
				});
				warm1.addEventListener('click', () => {
					get('/api/temperature/1700');
				});
				cold1.addEventListener('click', () => {
					get('/api/temperature/6500');
				});
				
				// Socket control
				toggle2.addEventListener('click', () => {
					socket.emit('toggle');
				});
				warm2.addEventListener('click', () => {
					socket.emit('temperature', 1700);
				});
				cold2.addEventListener('click', () => {
					socket.emit('temperature', 6500);
				});
			});
		</script>
	</head>
	<body style='display: flex;'>
		<div>
			<h1>Connected Devices</h1>
			<div id='devices'></div>
		</div>
		<div>
			<h1>HTTP Endpoint API</h1>
			<div>
				<label>On/Off</label>
				<button id='toggle1'>Toggle</button>
			</div>
			<div>
				<label>Temperature</label>
				<button id='warm1'>Warm</button>
				<button id='cold1'>Cold</button>
			</div>
		</div>
		<div>
			<h1>Socket</h1>
			<div>
				<label>On/Off</label>
				<button id='toggle2'>Toggle</button>
			</div>
			<div>
				<label>Temperature</label>
				<button id='warm2'>Warm</button>
				<button id='cold2'>Cold</button>
			</div>
		</div>
		<div>
			<h1>Non-Functional</h1>
			<label>Brightness</label>
			<input id='brightness' type='range'>
			<label>Color Temp</label>
			<input type='range'>
		</div>
	</body>
</html>
